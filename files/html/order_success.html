<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Заказ принят</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container mt-5">
      <h1>Ваш заказ принят!</h1>
      <p><strong>Имя:</strong> {{ order.first_name }}</p>
      <p><strong>Фамилия:</strong> {{ order.last_name }}</p>
      <p><strong>E-mail:</strong> {{ order.email }}</p>
      <p><strong>Телефон:</strong> {{ order.phone }}</p>
      <p><strong>Адрес:</strong> {{ order.address }}</p>
      <p>
        <strong>Длительность доставки:</strong> {{ order.get_duration_display }}
      </p>
      <p><strong>Объём баллона:</strong> {{ order.get_volume_display }}</p>
      <a href="{% url 'order_water' %}" class="btn btn-secondary"
        >Сделать новый заказ</a
      >
    </div>
  </body>
</html>
