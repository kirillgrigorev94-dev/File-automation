<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Форма заказа воды</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container mt-5">
      <h1>Заказ воды</h1>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label for="{{ form.first_name.id_for_label }}" class="form-label"
            >{{ form.first_name.label }}</label
          >
          {{ form.first_name }}
        </div>
        <div class="mb-3">
          <label for="{{ form.last_name.id_for_label }}" class="form-label"
            >{{ form.last_name.label }}</label
          >
          {{ form.last_name }}
        </div>
        <div class="mb-3">
          <label for="{{ form.email.id_for_label }}" class="form-label"
            >{{ form.email.label }}</label
          >
          {{ form.email }}
        </div>
        <div class="mb-3">
          <label for="{{ form.phone.id_for_label }}" class="form-label"
            >{{ form.phone.label }}</label
          >
          {{ form.phone }}
        </div>
        <div class="mb-3">
          <label for="{{ form.address.id_for_label }}" class="form-label"
            >{{ form.address.label }}</label
          >
          {{ form.address }}
        </div>
        <div class="mb-3">
          <label for="{{ form.duration.id_for_label }}" class="form-label"
            >{{ form.duration.label }}</label
          >
          {{ form.duration }}
        </div>
        <div class="mb-3">
          <label for="{{ form.volume.id_for_label }}" class="form-label"
            >{{ form.volume.label }}</label
          >
          {{ form.volume }}
        </div>
        <button type="submit" class="btn btn-primary">Отправить заказ</button>
      </form>
    </div>
  </body>
</html>
